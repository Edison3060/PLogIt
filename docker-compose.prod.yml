# Production Caddy is opt-in via the tls profile.
services:
  db:
    ports: !override []

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports: !override
      - "127.0.0.1:8090:8080"

  frontend:
    ports: !override
      - "127.0.0.1:8081:80"

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
