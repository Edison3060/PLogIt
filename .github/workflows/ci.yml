# ============================================================
# PLogIt - CI / DevSecOps pipeline.
#
# Designed to be GREEN from day one and light up progressively:
#  - the backend / frontend jobs check whether their code exists in
#    the first step; if not, the job exits cleanly (no failure).
#  - Semgrep (SAST) and Trivy (source + built images) run on every push/PR.
#    Fixable HIGH/CRITICAL findings are blocking; unfixed findings remain visible.
#
# Security notes:
#  - We install Trivy from a pinned release asset rather than using
#    aquasecurity/trivy-action or executing a mutable installation script.
#    The published checksum manifest is also pinned by SHA256, so altered
#    scanner binaries fail the build before execution.
#  - Container base images are pinned to immutable multi-platform digest refs
#    across build stages, Compose services, and CI jobs.
#  - All third-party actions are pinned to full 40-char commit SHAs, not
#    mutable tags like @v4. Mutable tags can be silently repointed by the
#    action owner, enabling supply-chain attacks (same root cause as the
#    trivy-action compromise). SHAs verified via the GitHub API.
#
# Cadence: build -> test -> Semgrep -> Trivy.
# ============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Maven build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Check backend code exists
        id: check
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Backend code found, continuing."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No backend/pom.xml yet, skipping backend job."
          fi
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend - lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Check frontend code exists
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Frontend code found, continuing."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet, skipping frontend job."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm test

  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # --error makes findings fail the build (blocking).
      # --exclude .env.example: .env.example is a template with placeholder
      # values (change-me-*), not real secrets. Scanning it produces only
      # false positives from the p/secrets ruleset.
      - run: semgrep scan --config p/default --config p/owasp-top-ten --config p/secrets --exclude .env.example --error

  trivy:
    name: Trivy - dependencies & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned Trivy CLI
        run: |
          set -euo pipefail
          version="0.76.1"
          archive="trivy_${version}_Linux-64bit.tar.gz"
          checksums="trivy_${version}_checksums.txt"
          release="https://github.com/aquasecurity/trivy/releases/download/v${version}"

          curl -fsSL --retry 3 -o "$checksums" "$release/$checksums"
          echo "885debc41b570179e81af560e5f393a66be29b9ff8c52915674f3eb2304c535d  $checksums" | sha256sum --check

          curl -fsSL --retry 3 -o "$archive" "$release/$archive"
          checksum_line="$(awk -v file="$archive" '$2 == file {print}' "$checksums")"
          test -n "$checksum_line"
          printf '%s\n' "$checksum_line" | sha256sum --check

          tar -xzf "$archive" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
          test "$(trivy --version | head -1)" = "Version: ${version}"
      - name: Set up JDK (for Maven dependency resolution)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Populate local Maven cache
        working-directory: backend
        run: mvn -B dependency:resolve -DskipTests || true
      # Review all HIGH/CRITICAL findings, including those without an upstream fix.
      # --ignore-unfixed is only used by the blocking check, not the report.
      - name: Trivy filesystem findings (including unfixed)
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 .

      - name: Trivy filesystem scan (block fixable findings)
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

      # Scan the FINAL runtime images, not just their source and dependencies.
      # Match the build contexts used in docker-compose.yml.
      - name: Build backend image
        run: docker build -t plogit-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t plogit-frontend:ci ./frontend

      - name: Trivy backend image findings (including unfixed)
        run: trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 plogit-backend:ci

      - name: Trivy backend image scan (block fixable findings)
        run: trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed plogit-backend:ci

      - name: Trivy frontend image findings (including unfixed)
        run: trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 plogit-frontend:ci

      - name: Trivy frontend image scan (block fixable findings)
        run: trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed plogit-frontend:ci

  proxy:
    name: Production proxy - validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate Caddyfile
        run: |
          docker run --rm -e APP_DOMAIN=plogit.example.com -e ACME_EMAIL=admin@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify pinned PostgreSQL image is pullable
        run: docker pull postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      - name: Validate production Compose and verification script
        env:
          APP_DOMAIN: plogit.example.com
          ACME_EMAIL: admin@example.com
          POSTGRES_DB: plogit
          POSTGRES_USER: plogit
          POSTGRES_PASSWORD: ci-example-password
          APP_CORS_ORIGINS: http://localhost:5173
          SEED_USER_EMAIL: leader@plogit.local
          SEED_USER_PASSWORD: ci-example-password
          SEED_USER_NAME: Demo Leader
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app --profile tls config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app --profile tls config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          published = {(str(p["published"]), p["target"]) for p in services["caddy"]["ports"]}
          assert ("80", 80) in published and ("443", 443) in published
          assert not services["db"].get("ports")
          assert "APP_SESSION_SECRET" not in services["backend"].get("environment", {})
          for name in ("backend", "frontend"):
              assert all(port.get("host_ip") == "127.0.0.1" for port in services[name]["ports"])
          '
          sh -n scripts/verify-https.sh

  deploy:
    name: CD - Deploy to Production
    needs: [backend, frontend, semgrep, trivy, proxy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require trusted SSH host fingerprint
        env:
          PROD_SSH_HOST_FINGERPRINT: ${{ secrets.PROD_SSH_HOST_FINGERPRINT }}
        run: |
          if [[ ! "$PROD_SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::Configure PROD_SSH_HOST_FINGERPRINT with your verified server SSH host-key SHA256 fingerprint before deployment."
            exit 1
          fi
      - name: SSH and Deploy
        uses: appleboy/ssh-action@068c0c7a4e59a5ae12fb7cb454b05735d830c82b
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA
          script: |
            set -eu
            cd ~/plogit/Repo
            git fetch --no-tags origin main
            git checkout --detach "$DEPLOY_SHA"
            if grep -Eq '^APP_ENABLE_TLS=true$' .env; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app --profile tls up -d --build
            else
              docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
            fi
